<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080809">
<title>Instalar Advento Tour</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icone-192.png">
<link rel="apple-touch-icon" href="./icone-180.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Advento Tour | Excursão 2026">
<meta property="og:description" content="17 de dezembro em Ribeirão Preto. Confira a programação, os ingressos e a reserva do transporte.">
<meta property="og:image" content="https://SEU-USUARIO.github.io/SEU-REPOSITORIO/capa-compartilhamento.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#371318,#080809 70%);color:#fff7f3;font:16px/1.5 system-ui,sans-serif}main{width:min(100%,420px);padding:20px;text-align:center}img{display:block;width:100%;max-height:50svh;object-fit:contain;margin:auto}h1{font:clamp(27px,7vw,38px) Georgia,serif;margin:12px 0 5px}p{margin:0 0 16px;color:#ead5d3}button{width:100%;min-height:48px;background:#b12638;color:white;border:0;border-radius:9px;font:700 1rem system-ui;cursor:pointer}a{display:inline-block;color:#f5c1ba;padding:12px}aside{margin-top:12px;background:#242024;border-radius:8px;padding:12px;text-align:left}
</style>
</head>
<body><main>
<img src="./capa-vertical.png" alt="Capa do Advento Tour 2026" width="1122" height="1402">
<h1>Advento Tour</h1><p>Excursão 2026 · Ribeirão Preto</p>
<button id="install" type="button">Instalar aplicativo</button>
<aside id="instructions" role="status" hidden></aside>
<a href="./aplicativo.html">Continuar pelo navegador</a>
</main>
<script>
const install = document.querySelector('#install');
const instructions = document.querySelector('#instructions');
let installPrompt;
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  installPrompt = event;
  instructions.hidden = true;
});
window.addEventListener('appinstalled', () => {
  location.replace('./aplicativo.html');
});
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
  location.replace('./aplicativo.html');
}
install.addEventListener('click', async () => {
  if (installPrompt) {
    const prompt = installPrompt;
    installPrompt = null;
    await prompt.prompt();
    return;
  }
  const appleMobile = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  instructions.textContent = appleMobile
    ? 'Abra este link no Safari, toque em Compartilhar, escolha Adicionar à Tela de Início e confirme em Adicionar.'
    : 'Abra este link no Chrome. No menu do navegador, procure Instalar app ou Adicionar à tela inicial.';
  instructions.hidden = false;
});
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('./sw.js').catch(console.warn);
}
</script>
</body></html>
